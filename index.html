<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="./css/app.css" />

<body class="bg-background text-on-surface font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container flex flex-col justify-between">

  <!-- Atmospheric Background Gradients & Ambient Glows -->
  <div class="fixed top-0 left-0 w-full h-[700px] bg-gradient-radial from-secondary-container/15 via-background to-background -z-10 pointer-events-none"></div>
  <div class="fixed top-[-15%] right-[-10%] w-[550px] h-[550px] rounded-full bg-primary-container/10 blur-[120px] -z-10 pointer-events-none"></div>
  <div class="fixed bottom-[-15%] left-[-10%] w-[650px] h-[650px] rounded-full bg-secondary-fixed/15 blur-[140px] -z-10 pointer-events-none"></div>

  <!-- Global Top Navigation Bar -->
  <header id="global-header" class="fixed top-0 left-0 w-full z-50 bg-surface/75 dark:bg-surface-dim/75 backdrop-blur-xl border-b border-primary/15 shadow-[0px_10px_30px_rgba(16,185,129,0.06)]"></header>

  <!-- Dynamic Application Root Content View -->
  <div id="app-root" class="flex-grow"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Global Footer -->
  <footer class="w-full py-10 px-4 md:px-margin-desktop bg-surface-container-highest border-t border-outline-variant/40 mt-auto z-10">
    <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="AppUI.navigate('home')" title="Go to SkillSetu Home">
        <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">spa</span>
        <div>
          <div class="font-headline-sm text-base font-bold text-on-surface">SkillSetu • Ayush Innovation Portal</div>
          <p class="font-label-sm text-xs text-on-surface-variant">SIH 2026 Final Round Prototype • Ministry of Ayush, Government of India</p>
        </div>
      </div>
      <div class="flex flex-wrap justify-center gap-6 font-label-sm text-xs text-on-surface-variant font-medium">
        <a href="javascript:void(0)" onclick="AppUI.navigate('home')" class="hover:text-primary transition-colors">Home</a>
        <a href="javascript:void(0)" onclick="AppUI.navigate('roles')" class="hover:text-primary transition-colors">Portals</a>
        <a href="javascript:void(0)" onclick="AppUI.navigate('feed')" class="hover:text-primary transition-colors">Ayush Feed</a>
        <a href="javascript:void(0)" onclick="AppUI.navigate('colleges')" class="hover:text-primary transition-colors">Colleges Directory</a>
        <a href="javascript:void(0)" onclick="AppUI.navigate('ministry-insights')" class="hover:text-primary transition-colors">National Insights</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="./js/app-data.js"></script>
  <script src="./js/app-state.js"></script>
  <script src="./js/app-ui.js"></script>
